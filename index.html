<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN" crossorigin="anonymous"></script>

    <script src="./index.js" defer></script>
    <title>Album List</title>
</head>
<body>
    <header>
        <div class="titulo">
            <h1>A Minha PLAYLIST</h1>
        </div>
          <!-- Button trigger modal -->
          <button type="button" id="btnadd" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-plus-circle" viewbox="0 0 16 16">
              <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
              <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/>
            </svg>
        </button>

            <!-- Modal -->
           
                <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
                  <div class="modal-dialog">
                    <form class="modal-content" id="form-album">

                      <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">ALBUM</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                      </div>

                      <div class="modal-corpo">
                        <div class="boxart">
                          <label for="nomeart">Nome do Artista / Banda: </label>
                          <input id="nomeart" type="text" placeholder="Nome da Banda/Artista">
                        </div>
                        
                        <div class="boxalbm">
                          <label for="nomealb" >Nome do Album: </label>
                          <input id="nomealb" type="text" placeholder="Nome do album"> 
                        </div>

                        <div class="boxdata">
                          <label for="data">Data de Lançamento: </label>
                          <input type="date" name="data" id="data" required>
                        </div>

                        <div class="url-album">
                          <label for="data">URL: </label>
                          <input type="text" name="url" id="urlalbum" required>
                        </div>

                        <div class="boxestilo">
                          <label for="estilo">Estilo: </label>
                          <select id="estilo" required>
                            <option value=""></option>
                            <option value="Rock">Rock</option>
                            <option value="Indie">Indie</option>
                            <option value="POP">POP</option>
                            <option value="Reggae">Reggae</option>
                            <option value="Jazz">Jazz</option>
                            <option value="HIP-HOP/RAP">HIP-HOP/RAP</option>
                          </select>
                        </div>
                          
                        <div class="boxspr">
                          <label for="tipo">SUPORTE: </label>

                          <select id="tipo" required>
                            <option value=""></option>
                            <option value="Vinil">Vinil</option>
                            <option value="CD">CD</option>
                            <option value="K7">K7</option>
                            <option value="Digital">Digital</option>
                          </select>
                        </div>

                      </div>

                      <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
                        <input type="submit" class="btn btn-primary" value="Guardar" >                    
                      </div>

                    </form>
                  </div>
                </div>
           
    </header>
   
    <main>
                      <!--           CARD         -->
              <div id="album" class="row row-cols-1 row-cols-md-3 g-4">
               <!--    <div class="col">
                    <div class="card">
                      <img src="./wallalbum.webp" class="card-img-top" alt="...">
                      <div class="card-body">
                        <h3 class="card-title">Titulo Album</h3>
                        <div>
                          <h6>Artista</h6>
                        </div>
                        <a href="#" class="btn btn-primary" style="background-color: blueviolet; border: black;">Ver +</a>
                      </div>
                    </div>
                  </div> -->
              </div>

    </main>

    <aside>
        <div class="filtros_genero">
              <div class="" id="genero" >
                  <h3>Gênero</h3>
              </div>
              <div id="inpfilt">
                      <div class="filtros" id="in_rock">
                        <input type="checkbox" class="inputs" name="inp1" id="inp1">
                        <label for="">ROCK</label>
                      </div>

                      <div class="filtros">
                        <input type="checkbox" class="inputs" name="inp2" id="inp2">
                        <label for="">POP</label>
                      </div>

                      <div class="filtros">
                        <input type="checkbox" class="inputs" name="inp3" id="inp3">
                        <label for="">JAZZ</label>
                      </div>

                      <div class="filtros">
                        <input type="checkbox" class="inputs" name="inp4" id="inp4">
                        <label for="">INDIE</label>
                      </div>

                      <div class="filtros">
                        <input type="checkbox" class="inputs" name="inp5" id="inp5">
                        <label for="">REGGAE</label>
                      </div>

                      <div class="filtros">
                        <input type="checkbox" class="inputs" name="inp5" id="inp6">
                        <label for="">HIP-HOP / RAP</label>
                      </div>       
              </div>
        </div>

        <div class="filtro_suportes">
                <div class="titulo-suporte" id="suportes" >
                    <h3>Suporte</h3>
                </div>
                <div id="inpsuportes">
                        <div class="filtros-suporte" id="cd">
                          <input type="checkbox" class="inputs" name="inpcd" id="inpcd">
                          <label for="">CD</label>
                        </div>

                        <div class="filtros-suporte" >
                          <input type="checkbox" class="inputs" name="inpvin" id="inpvin">
                          <label for="">Vinil</label>
                        </div>

                        <div class="filtros-suporte">
                          <input type="checkbox" class="inputs" name="inpk7" id="inpk7">
                          <label for="">K7</label>
                        </div>

                        <div class="filtros-suporte">
                          <input type="checkbox" class="inputs" name="inpdig" id="inpdig">
                          <label for="">Digital</label>
                        </div>
                </div>      
        </div>
                  
    </aside>
     
</body>
</html>
